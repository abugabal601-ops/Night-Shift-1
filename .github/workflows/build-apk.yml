
name: Build Night Shift APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web files
        run: |
          mkdir -p public
          if [ -f index.html ]; then cp index.html public/; fi
          if [ -f style.css ]; then cp style.css public/; fi
          if [ -f game.js ]; then cp game.js public/; fi
          if [ -f server-config.js ]; then cp server-config.js public/; fi
          if [ -d assets ]; then cp -r assets public/; fi
          test -f public/index.html

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
