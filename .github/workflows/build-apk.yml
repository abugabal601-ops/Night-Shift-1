
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Java
        run: java -version

      - name: Prepare web files
        run: |
          mkdir -p public
          if [ -f index.html ]; then cp index.html public/; fi
          if [ -f style.css ]; then cp style.css public/; fi
          if [ -f game.js ]; then cp game.js public/; fi
          if [ -d assets ]; then cp -r assets public/; fi
          test -f public/index.html

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org/

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --registry=https://registry.npmjs.org/

      - name: Build Android APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
