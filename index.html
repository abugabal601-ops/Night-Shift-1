<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NIGHT SHIFT — Co-op Horror Prototype</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="game"></div>
<div id="menu" class="panel">
  <div class="eyebrow">CO-OP HORROR • PROTOTYPE 0.1</div>
  <h1>NIGHT<br><span>SHIFT</span></h1>
  <p class="subtitle">Something is still inside.</p>
  <label for="playerName">CALLSIGN</label><input id="playerName" maxlength="16" placeholder="Player" value="Player">
  <button id="createBtn">CREATE PRIVATE ROOM</button>
  <div class="joinrow"><input id="roomCode" maxlength="8" placeholder="ROOM CODE"><button id="joinBtn" class="secondary">JOIN</button></div>
  <p id="status">Create a room, then share its code with 1–3 friends.</p>
  <div class="controls">WASD / arrow keys to move · Mouse to look · E to collect evidence</div>
</div>
<div id="hud" class="hidden">
  <div class="topline"><div class="roomtag">ROOM <b id="hudCode">----</b></div><div id="players">PLAYERS 1/4</div></div>
  <div class="objective"><b>OBJECTIVE</b><span id="evidence">Evidence found: 0 / 3</span></div>
  <div id="hint">Find the glowing evidence.</div>
  <button id="leaveBtn">LEAVE ROOM</button>
</div>
<div id="mobileControls" class="hidden">
  <div class="dpad"><button data-move="forward">▲</button><div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div>
  <button id="lookBtn">LOOK MODE</button><button id="collectBtn">COLLECT</button>
</div>
<div id="toast"></div>
<script src="/server-config.js"></script>
<script type="module" src="/game.js"></script>
</body></html>
